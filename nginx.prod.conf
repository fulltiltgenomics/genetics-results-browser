server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # nginx inherits add_header into a location ONLY if that location declares no add_header of
    # its own, so the server-level security headers this file used to carry were silently
    # dropped on exactly the responses that need them (index.html and every asset, both of
    # which set Cache-Control). They are therefore repeated per location, with `always` so they
    # are emitted on error responses too.
    #
    # The app is fully self-hosted (no CDN, no external fonts), so the policy can be tight:
    # 'unsafe-inline' is needed for style only, because MUI/emotion inject <style> at runtime
    # and index.html carries one inline <style>. data:/blob: images cover the chat's inline
    # base64 figures and canvas-rendered charts.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'";

    location ~* \.js$ {
        add_header Content-Type application/javascript;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $csp always;
    }

    # static files caching
    location /assets {
        expires 30d;
        access_log off;
        gzip_static on;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $csp always;
    }

    # SPA routing - all routes should fall back to index.html where the react app is rendered
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # gzip compression
    gzip on;
    gzip_types text/plain text/css text/tab-separated-values application/json application/javascript;
    gzip_min_length 1000;
}
