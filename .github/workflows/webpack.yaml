name: webpack

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    name: webpack
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
    - run: npm ci
    # before the build: vite/rolldown strips types without checking them, so a type
    # error would otherwise sail through a green build
    - run: npm run typecheck
    - run: npm run build
